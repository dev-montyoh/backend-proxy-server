# Docker Swarm 전환 테스트용 라우팅
# swarm-test.montyoh.dev → Swarm 스택(swarm-test)이 호스트 8091로 publish한 서비스
#
# ※ $connection_upgrade(map)는 vikunja.conf에서 http 전역으로 정의됨 → 여기선 참조만
# ※ 대상이 Docker 컨테이너 이름이 아니라 호스트(host.docker.internal)라,
#    다른 conf들처럼 `set $var` + resolver(127.0.0.11) 방식을 쓰지 않는다.
#    (127.0.0.11은 Docker 내부 DNS라 host.docker.internal을 해석하지 못함)
#    → /etc/hosts로 해석되도록 proxy_pass에 직접 명시.
#    이를 위해 backend-proxy-server 컨테이너에 아래 설정이 필요:
#        extra_hosts:
#          - "host.docker.internal:host-gateway"

server {
    listen 80;
    server_name swarm-test.montyoh.dev;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    client_max_body_size 20m;

    location / {
        proxy_pass http://host.docker.internal:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthcheck {
        default_type text/plain;
        return 200 "OK\n";
    }
}
