# WebSocket 업그레이드용 $connection_upgrade 변수는 vikunja.conf의 map 블록에서 정의됨
# (map은 http 레벨 전역이라 재정의 시 중복 에러 → 여기서는 참조만)

server {
    listen 80;
    server_name affine.montyoh.dev;

    resolver 127.0.0.11 valid=30s;  # Docker 내부 DNS
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    client_max_body_size 100m;  # 이미지/첨부 업로드 대비

    location / {
        set $affine http://affine:3010;
        proxy_pass $affine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthcheck {
        default_type text/plain;
        return 200 "OK\n";
    }
}
