server {
    listen 80;
    server_name www.dev-monty.me;

    resolver 127.0.0.11 valid=30s;  # Docker 내부 DNS
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;


    location / {
        proxy_pass http://frontend-portfolio:8080;
    }

    location /api {
        proxy_pass http://backend-api-server-gateway:3000;
    }

    location /healthcheck {
        default_type text/plain;
        return 200 "OK\n";
    }

#     location / {
#         root /usr/share/nginx/html;
#         index index.html;
#     }
}

server {
    listen 80 default_server;
    server_name _;

    return 403 "Access denied. Valid domain required.\n";
}