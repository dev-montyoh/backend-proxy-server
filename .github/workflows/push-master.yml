name: push-master.yml
on:
#  임시 테스트
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  push_master:
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v5

      # 시크릿 스토어 체크아웃
      - name: Check out Secrets store
        uses: actions/checkout@v5
        with:
          repository: 'dev-montyoh/secrets-store'
          token: ${{ secrets.SECRETS_STORE_ACCESS_TOKEN }}
          path: secrets-store

      # 시크릿 값들 로드
      - name: Load secrets
        run: |
          grep -v '^#' secrets-store/github.properties >> $GITHUB_ENV
          grep -v '^#' secrets-store/aws.properties >> $GITHUB_ENV
          echo "Secrets loaded"

      - name: Load SSH key
        run: |
          SSH_KEY_CONTENT=$(cat secrets-store/ec2-ssh-key)
          echo "EC2_SSH_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # SSH 연결
      - name: Set up SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_REGISTRY_ACCESS_TOKEN: ${{ env.DOCKER_REGISTRY_ACCESS_TOKEN }}
          DOCKER_REGISTRY_USERNAME: ${{ github.repository_owner }}
        with:
          host: ${{ env.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ env.EC2_SSH_KEY }}
          envs: DOCKER_REGISTRY_ACCESS_TOKEN,DOCKER_REGISTRY_USERNAME
          script: |
            # 기존 서비스 및 이미지 삭제
            docker ps -q --filter "name=backend-proxy-server" | xargs -r docker stop
            docker ps -a -q --filter "name=backend-proxy-server" | xargs -r docker rm
            docker images -q ghcr.io/$DOCKER_REGISTRY_USERNAME/backend-proxy-server:latest | xargs -r docker rmi -f
            
            # docker-compose.yml 연결 및 특정 서비스 시작
            echo "$DOCKER_REGISTRY_ACCESS_TOKEN" | docker login ghcr.io -u dev-montyoh --password-stdin
            cd /home/ec2-user/app
            curl -L -o docker-compose.yml https://raw.githubusercontent.com/dev-montyoh/iac-terraform/refs/heads/master/docker-compose.yml
            docker-compose pull backend-proxy-server
            docker-compose up -d backend-proxy-server